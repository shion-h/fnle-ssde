[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fnle_ssde"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arviz==0.22.0",
    "matplotlib==3.10.5",
    "nflows==0.14",
    "numpy==2.3.2",
    "pandas==2.3.2",
    "pyro-ppl==1.9.1",
    "sbi==0.24.0",
    "scipy==1.16.1",
    "torch==2.5.1",
    "tqdm==4.67.1",
]

